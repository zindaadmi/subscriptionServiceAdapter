plugins {
	id 'java'
	id 'java-library'
}

group = 'com.framework'
version = '1.0.0'
description = 'Hexagonal Framework - Reusable Template'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

// Framework Core Dependencies (minimal set)
dependencies {
	// YAML Configuration
	implementation 'org.yaml:snakeyaml:2.2'
	
	// HTTP Server (Jetty)
	implementation 'org.eclipse.jetty:jetty-server:11.0.20'
	implementation 'org.eclipse.jetty:jetty-servlet:11.0.20'
	// Jakarta Servlet API (required by Jetty 11)
	implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
	
	// JSON Processing
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'
	implementation 'com.fasterxml.jackson.core:jackson-core:2.16.1'
	implementation 'com.fasterxml.jackson.core:jackson-annotations:2.16.1'
	
	// Database Connection Pool
	implementation 'com.zaxxer:HikariCP:5.1.0'
	
	// Database Drivers (optional - users can add their own)
	runtimeOnly 'com.h2database:h2:2.2.224'
	
	// Logging
	implementation 'org.slf4j:slf4j-api:2.0.9'
	implementation 'ch.qos.logback:logback-classic:1.4.14'
}

// Test Dependencies
dependencies {
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
	testImplementation 'org.mockito:mockito-core:5.7.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// JAR task
jar {
	manifest {
		attributes(
			'Implementation-Title': project.name,
			'Implementation-Version': project.version
		)
	}
	archiveBaseName = 'hexagonal-framework'
}




